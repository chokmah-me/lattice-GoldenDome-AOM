name: verifier-gates

# Fast gates (A, B, D) run on every push/PR and must exit 0.
# The Monte Carlo long gate (E) runs on the weekly Monday schedule and on demand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  fast-verifiers:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fast verifier gates (A, B, D)
        run: |
          set -euo pipefail
          python claims/verify_a_ghost.py
          python claims/verify_b_quant.py
          python claims/verify_d_analytical.py
      - name: Run verifier C (gating — adjudicated 2026-10-12)
        # claims/verify_c_lethal.py check-3a is solver-sensitive (Lorenz
        # entropy tape via scipy RK45). Adjudicated 2026-10-12 (ruling A):
        # pinned to the author's green env (scipy==1.17.1, numpy==2.4.4) in
        # requirements.txt and re-verified green. Gating again.
        run: |
          set -euo pipefail
          python claims/verify_c_lethal.py

  montecarlo:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Monte Carlo long gate (E)
        run: |
          set -euo pipefail
          python claims/verify_e_montecarlo.py
